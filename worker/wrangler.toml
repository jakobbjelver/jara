# JARA Change Request Worker
name = "jara-change-requests"
main = "index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "jara-change-requests"
database_id = "c2de4475-93f4-4b75-8bcd-37376db72865"

# Shared secret for the Hermes triage cron read API.
# Set via: wrangler secret put TRIAGE_SECRET

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "jara-screenshots"
