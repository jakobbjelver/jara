# CoreDevice Tailnet Bridge configuration
# One-time setup required (return day, ~60s of USB):
#   1. Plug iPhone into the Mac mini via USB, Trust, let Xcode pair + stage DDI.
#   2. Capture Bonjour TXT while plugged:
#        dns-sd -B _remotepairing._tcp local.
#        dns-sd -L "<instance>" _remotepairing._tcp local.
#   3. Fill rp_instance / rp_authtag below (remove PLACEHOLDER values).
#   4. Start the bridge: launchctl bootstrap gui/$(id -u) \
#        ~/Repos/jara/tool/com.jara.coredevice-tailnet.plist
#      (or the Portal action "iPhone Bridge Start")

[bridge]
# CoreDevice front door on the iPhone (fixed) + trusted-tunnel dynamic range
front_door_port = 49152
range_start = 54900
range_end = 55600

[host]
# Mac side. bind_host empty = auto-detect default-route interface (Wi-Fi en1).
bind_host =
# Upstream hop: the tailscale container, via OrbStack hostname resolution
# (the macOS host has NO direct tailnet route).
upstream_host = tailscale.orb.local

[container]
# Phone's tailnet IP ("iphone-16" node). Re-check via: docker exec tailscale tailscale status
phone_tailnet_ip = 100.113.136.113

[bonjour]
# Captured 2026-08-16 via USB (dns-sd -B/-L _remotepairing._tcp local.).
# Two live instances observed; swap to the second if the pairing handshake
# ever stumbles (CoreDevice auth is pair-record based, not TXT-based):
#   alt instance 80AB9159-7C66-4E41-A928-5624ABAAD1BC authTag gDCzHNnr
rp_instance = 7BA6553F-6D02-4A94-8CA0-A935CE0E8E95
rp_authtag = ZQJx8tWj
ver = 24
minver = 8
flags = 0
spoof_hostname = iphone-16.local

# NOTE: TCP 55555 cannot be bound on this Mac (macOS port exclusion —
# bind returns EADDRINUSE with no visible owner). The bridge logs one WARN
# and continues on 701/702 ports. Apple's trusted-tunnel allocator uses
# ~55110-55359, so the gap is theoretical.
