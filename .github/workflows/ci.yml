name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib/ test/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
      - run: flutter pub get
      - run: flutter test
