<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C4001E"/>
      <stop offset="0.5" stop-color="#E6002B"/>
      <stop offset="1" stop-color="#FF2440"/>
    </linearGradient>
    <radialGradient id="coreGrad">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFB3BD"/>
      <stop offset="0.7" stop-color="#FF5C70"/>
      <stop offset="1" stop-color="#E6002B"/>
    </radialGradient>
    <radialGradient id="coreSheen">
