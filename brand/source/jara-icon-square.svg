<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171A"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <!-- face: pure neon yellow sweep -->
    <linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFF86B"/>
      <stop offset="0.35" stop-color="#FFE600"/>
      <stop offset="1" stop-color="#D4AA00"/>
    </linearGradient>
    <!-- extruded side: yellow darkened -->
    <linearGradient id="side" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6B7300"/>
      <stop offset="1" stop-color="#544400"/>
    </linearGradient>
    <!-- halo: yellow glow -->
    <linearGradient id="halo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFF033"/>
      <stop offset="1" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="blur4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="bigBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="bgBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- blurry background field – all yellow tones now -->
  <g filter="url(#bgBlur)">
    <ellipse cx="270" cy="240" rx="330" ry="300" fill="#FFF44D" opacity="0.13"/>
    <ellipse cx="520" cy="520" rx="380" ry="360" fill="#FFE600" opacity="0.12"/>
    <ellipse cx="860" cy="210" rx="240" ry="220" fill="#FFCC00" opacity="0.09"/>
    <ellipse cx="780" cy="810" rx="360" ry="320" fill="#FFB800" opacity="0.14"/>
  </g>
  <g transform="translate(512 512) skewX(-7) translate(-512 -512)"
     fill="none" stroke-width="88" stroke-linecap="round" stroke-linejoin="round">
    <!-- cast shadow -->
    <g transform="translate(8 36)" stroke="#000000" opacity="0.5" filter="url(#bigBlur)">
      <path d="M472 348 L696 512 L472 676"/>
      <rect x="780" y="450" width="120" height="120" rx="40" fill="#000000" stroke="none"/>
    </g>
    <!-- extruded depth -->
    <g transform="translate(10 16)" stroke="url(#side)">
      <path d="M280 348 L504 512 L280 676" opacity="0.18"/>
      <path d="M376 348 L600 512 L376 676" opacity="0.45"/>
      <path d="M472 348 L696 512 L472 676"/>
      <rect x="780" y="450" width="120" height="120" rx="40" fill="url(#side)" stroke="none"/>
    </g>
    <!-- neon halo -->
    <g stroke="url(#halo)" opacity="0.55" filter="url(#softBlur)">
      <path d="M472 348 L696 512 L472 676"/>
      <rect x="780" y="450" width="120" height="120" rx="40" fill="url(#halo)" stroke="none"/>
    </g>
    <!-- rim light -->
    <g transform="translate(-5 -7)" stroke="#FFFFC2" stroke-width="96" opacity="0.7">
      <path d="M472 348 L696 512 L472 676"/>
    </g>
    <rect x="775" y="443" width="130" height="130" rx="46" fill="#FFFFC2" opacity="0.7"/>
    <!-- faces -->
    <g stroke="url(#face)">
      <path d="M280 348 L504 512 L280 676" opacity="0.18"/>
      <path d="M376 348 L600 512 L376 676" opacity="0.45"/>
      <path d="M472 348 L696 512 L472 676"/>
      <rect x="780" y="450" width="120" height="120" rx="40" fill="url(#face)" stroke="none"/>
    </g>
    <!-- gloss -->
    <rect x="792" y="460" width="96" height="38" rx="19" fill="#FFFFFF" opacity="0.4" filter="url(#blur4)"/>
  </g>
</svg>