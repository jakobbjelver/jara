# JARA smoketest — flow 1: boot + tab navigation
# Deterministic gate flow (SELF-IMPROVEMENT.md §7). No vision gating.
appId: com.jara.jara
---
- launchApp
- assertVisible: "Start Run"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Analytics"
- assertVisible: "Analytics"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Report Bug"
- assertVisible: "Request Feature"
- tapOn: "Run"
- assertVisible: "Start Run"
