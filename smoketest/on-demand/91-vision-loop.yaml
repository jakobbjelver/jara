appId: com.jara.jara
---
- tapOn:
    text: "Run.*"
    index: 0
- takeScreenshot: tab-run
- tapOn:
    text: "History.*"
    index: 0
- takeScreenshot: tab-history
- tapOn:
    text: "Analytics.*"
    index: 0
- takeScreenshot: tab-analytics
- tapOn:
    text: "Settings.*"
    index: 0
- takeScreenshot: tab-settings
- scrollUntilVisible:
    element:
      text: "Report Bug"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Report Bug"
- takeScreenshot: cr-form-top
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
    timeout: 30000
- takeScreenshot: cr-form-bottom
